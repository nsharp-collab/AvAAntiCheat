name: Publish Plugin Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' # 1.21.x requires Java 21
          distribution: 'temurin'

      - name: Build Plugin with Maven
        run: mvn clean package

      - name: Publish to Modrinth and CurseForge
        uses: Kirstein/mc-publish@v3.3
        with:
          # --- Modrinth Configuration ---
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-id: 'iXTlzYhq'

          # --- CurseForge Configuration ---
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-id: '1378249'

          # --- Plugin & Version Info ---
          files: 'target/AvAAntiCheat*.jar' # Updated for Maven output directory
          loaders: |
            paper
            spigot
            purpur
            bukkit
          game-versions: |
            1.21
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
          version-type: 'release'
          version-name: ${{ github.event.release.name }}
          changelog: ${{ github.event.release.body }}
